name: Keep Render Backend Alive

on:
  schedule:
    # Runs every 10 minutes, 24/7
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  ping-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Endpoint
        run: |
          echo "Pinging Render backend to prevent sleep..."
          curl -s https://swiftnexus-ai.onrender.com/
          echo "Ping completed successfully!"
