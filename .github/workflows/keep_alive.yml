name: Keep Streamlit App Awake

on:
  schedule:
    # Runs every 6 hours to stay well ahead of the inactivity timer
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows you to trigger this manually whenever you want

jobs:
  wake-app:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Selenium Automation Tools
      run: |
        python -m pip install --upgrade pip
        pip install selenium

    - name: Execute Wake Up Script
      run: python wake_app.py
